# No internal detail in the error responses: a default can change between Spring Boot
# versions, so this file says what is wanted, not what happens to be the case today.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Behind the TLS-terminating proxy (infra/caddy/Caddyfile): trust the X-Forwarded-*
# headers it sets, so the app sees the real scheme and the real caller instead of the
# proxy's own. This is what lets Spring Security emit HSTS - it writes that header only
# on a request it considers secure - and what keeps the login rate limiter keyed on the
# caller rather than on a single constant address.
#
# Safe ONLY because what reaches this service comes from the gateway, which takes the caller's
# address from what the proxy overwrites and ignores a Forwarded header from the caller. Never
# enable this on a service reachable directly from the internet: a caller could then claim any
# address it likes and walk around the rate limiting.
server.forward-headers-strategy=framework
