# SPRING_PROFILES_ACTIVE=dev outside a container.
#
# What changes here is only what makes sense while somebody is watching: the SQL, the
# verbose errors. The connection details stay in application.properties, which already
# resolves to localhost outside a container via its env-var defaults... except this
# service has none, on purpose (see application.properties) - set them in .env instead.

# Read by the gateway's Swagger UI. See application.properties for why it is off elsewhere.
springdoc.api-docs.enabled=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO
logging.level.centuryroad=DEBUG

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

spring.devtools.restart.enabled=true
