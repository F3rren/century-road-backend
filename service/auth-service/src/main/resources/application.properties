spring.application.name=auth-service

server.port=${AUTH_PORT:8081}

# DataSource - injected via environment (Docker Compose or IDE run config). A database of
# its own: backend used to own a users table, but user identity now lives only here - see
# the migration in backend that drops events.author_id's foreign key for why.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate never changes the schema, only checks it matches: Flyway's migrations are the
# only thing that can.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Actuator - same pair backend exposes, so this service shows up on the same Prometheus/
# Grafana dashboards without a special case.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.prometheus.metrics.export.enabled=true

# JWT - the same secret backend will eventually verify with, injected via environment.
# No fallback on purpose: a service issuing tokens signed with an empty key is worse than
# a service that refuses to start.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# The first administrator, created only if the users table is empty - see
# FirstAdminBootstrap. Left empty, the mechanism stays inert.
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# API documentation (an OpenAPI document at /v3/api-docs), off unless switched on: the gateway
# is public in production, and describing an API is something to enable on purpose. The dev
# profile turns it on; anywhere else, SPRINGDOC_API_DOCS_ENABLED=true does. The interactive
# page (Swagger UI) is not here at all - the gateway serves it, for every service at once.
# SecurityConfig opens the document's route to the gateway only while this is true.
springdoc.api-docs.enabled=false
# Documentation only: without it every answer is listed as */*. It does not restrict what
# the endpoints accept or produce.
springdoc.default-produces-media-type=application/json

logging.level.root=INFO
logging.level.centuryroad=DEBUG

# Locked down by default, same reasoning as backend eventually needs too: forgetting
# SPRING_PROFILES_ACTIVE should land on the hardened profile, not a permissive default.
spring.profiles.default=prod
