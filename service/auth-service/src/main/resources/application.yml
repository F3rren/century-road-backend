spring:
  application:
    name: auth-service

  # On the VPS every secret is a file in /run/secrets named after its property (compose-prod.yml mounts
  # them: spring.datasource.password, jwt.secret), and this reads them as properties. Where that directory
  # does not exist (Railway, development, tests) it is skipped and the environment variables below do
  # the job. A variable that is set wins over a file. CENTURY_ROAD_SECRETS_DIR exists for tests.
  config:
    import: "optional:configtree:${CENTURY_ROAD_SECRETS_DIR:/run/secrets}/"

  # Database connection details are supplied by the environment.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # How long a request waits for a free connection before it fails (HikariCP's default is
    # 30s, which keeps a request - and the gateway connection behind it - hanging through a
    # database stall). Kept at 5s rather than shorter: Flyway and the pool's first connection
    # go through this too at startup, where a database that is still waking up should get a
    # fair chance before the service gives up.
    hikari:
      connection-timeout: 5000

  # Flyway changes the schema; Hibernate only validates it.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Use the production profile when no active profile is specified.
  profiles:
    default: prod

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true

# Every key below is bound and validated by AuthProperties: a missing or out-of-range value stops the
# service at startup with the property named.
jwt:
  # Neither the signing secret nor token lifetime has a fallback.
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}

# Login attempts per ip|email within one window (LoginAttemptLimiter).
auth:
  rate-limit:
    max-attempts: 5
    window-ms: 60000

# BCrypt's work factor for new password hashes. Below 10 the service refuses to start, except under
# the test profile (SecurityConfig); an older hash is upgraded at its owner's next login.
security:
  password:
    bcrypt-strength: 12

bootstrap:
  admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc:
  api-docs:
    enabled: false
  default-produces-media-type: application/json

logging:
  level:
    root: INFO
  pattern:
    # The request id RequestCorrelationFilter puts in the MDC, in every line written while a request is
    # answered, and "-" outside one (startup, the nightly index). It was minted and handed back to the client
    # but never printed, so a person quoting it left nothing to search. Boot prints this right after the
    # thread name, where it puts a trace id; the same id is a field of every line in the JSON formats
    # (LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs).
    correlation: "[%X{requestId:--}] "