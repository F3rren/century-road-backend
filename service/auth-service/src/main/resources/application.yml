spring:
  application:
    name: auth-service

  # Database connection details are supplied by the environment.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # How long a request waits for a free connection before it fails (HikariCP's default is
    # 30s, which keeps a request - and the gateway connection behind it - hanging through a
    # database stall). Kept at 5s rather than shorter: Flyway and the pool's first connection
    # go through this too at startup, where a database that is still waking up should get a
    # fair chance before the service gives up.
    hikari:
      connection-timeout: 5000

  # Flyway changes the schema; Hibernate only validates it.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Use the production profile when no active profile is specified.
  profiles:
    default: prod

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true

jwt:
  # Neither the signing secret nor token lifetime has a fallback.
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}

bootstrap:
  admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc:
  api-docs:
    enabled: false
  default-produces-media-type: application/json

logging:
  level:
    root: INFO
  pattern:
    # The request id RequestCorrelationFilter puts in the MDC, in every line written while a request is
    # answered, and "-" outside one (startup, the nightly index). It was minted and handed back to the client
    # but never printed, so a person quoting it left nothing to search. Boot prints this right after the
    # thread name, where it puts a trace id; the same id is a field of every line in the JSON formats
    # (LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs).
    correlation: "[%X{requestId:--}] "