# Set SPRING_PROFILES_ACTIVE=dev outside a container.
#
# Enable settings useful during local development: SQL logging, verbose errors,
# and DevTools restart. Connection details remain in application.properties.
# This service has no local connection defaults by design; set them in .env.

# Read by the gateway's Swagger UI. See application.properties for why
# the API docs are disabled in other environments.
springdoc:
  api-docs:
    enabled: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    root: INFO
    centuryroad: DEBUG

spring:
  jpa:
    properties:
      hibernate:
        format_sql: true
  devtools:
    restart:
      enabled: true

server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param