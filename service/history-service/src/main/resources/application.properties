spring.application.name=history-service

server.port=${HISTORY_PORT:8082}

# Answers are JSON envelopes of up to ~100 KB for a day with many births; worth compressing.
# The gateway forwards the encoding untouched.
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=2KB

# Which edition is used when the one asked for has nothing for a section (the Italian feed has
# no births or deaths) or cannot be reached. The languages a caller may ask for are the
# Language enum, on purpose: the code ends up in a hostname.
history.fallback-language=en

# How long a day is served without asking Wikipedia again, and how long an old copy stays
# usable when Wikipedia cannot refresh it. History barely changes, so both are generous:
# fewer requests upstream is the polite thing and the fast thing. max-entries is a full year
# in two languages.
history.cache.fresh-ttl=6h
history.cache.max-stale=7d
history.cache.max-entries=800

# Wikipedia. host-template is the only place the host is written down. contact has no default
# on purpose: Wikimedia's User-Agent policy wants a way to reach whoever runs the client, and
# a service that starts without one is one that may be blocked without notice. Set
# WIKIMEDIA_CONTACT to a URL or an address - the repository URL is enough.
history.wikipedia.host-template=https://{lang}.wikipedia.org
history.wikipedia.client-name=CenturyRoad-History/0.1
history.wikipedia.contact=${WIKIMEDIA_CONTACT}
history.wikipedia.connect-timeout=2s
# A cold response has been seen to take ~4 s, cached ones ~0.2 s.
history.wikipedia.read-timeout=5s
# A day is 60-620 KB. Anything past this is not a feed.
history.wikipedia.max-body-bytes=8388608
# Used when a 429 carries no usable Retry-After; the etiquette page says wait at least 5 s.
history.wikipedia.default-cooldown=5s
history.wikipedia.max-cooldown=10m

# Wikipedia asks for three or fewer requests at once.
history.resilience.max-concurrent-calls=3
history.resilience.bulkhead-max-wait=1s
history.resilience.retry-attempts=2
history.resilience.retry-wait=300ms
history.resilience.breaker-open-duration=30s

# DataSource - the same Postgres instance auth-service uses (injected via environment, same
# as there), but this service's own schema within it ("history", below), not its own database:
# one Postgres container to run in development is simpler than two, and a schema already gives
# each service's tables their own namespace and, via flyway.schemas, their own migration
# history - nothing here can collide with auth-service's users/refresh_tokens tables.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate never changes the schema, only checks it matches: Flyway's migrations are the
# only thing that can.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway. schemas=history both puts this service's tables in their own schema (created if
# missing) and, just as important, keeps its flyway_schema_history table there too - without
# this it would default to "public", the same schema auth-service's own Flyway already
# manages in that database, and the two services' migration histories would collide.
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.schemas=history

# Actuator - the pair every service exposes to Prometheus. Only these two: the metrics
# endpoint adds nothing Prometheus does not already scrape.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized
management.prometheus.metrics.export.enabled=true

# API documentation (an OpenAPI document at /v3/api-docs), off unless switched on: the gateway
# is public in production, and describing an API is something to enable on purpose. The dev
# profile turns it on; anywhere else, SPRINGDOC_API_DOCS_ENABLED=true does. The interactive
# page (Swagger UI) is not here at all - the gateway serves it, for every service at once.
springdoc.api-docs.enabled=false
# Documentation only: without it every answer is listed as */*. It does not restrict what
# the endpoint accepts or produces.
springdoc.default-produces-media-type=application/json

logging.level.root=INFO
logging.level.centuryroad=DEBUG

# Locked down by default, same reasoning as the other services: forgetting
# SPRING_PROFILES_ACTIVE should land on the hardened profile, not a permissive default.
spring.profiles.default=prod
