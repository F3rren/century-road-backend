# Test-only values, never used outside this profile.
history:
  wikipedia:
    # .invalid is reserved (RFC 2606). If a test forgets to stub
    # Wikipedia, this hostname should not resolve to the real service.
    contact: "https://example.invalid/century-road-tests"
    host-template: "http://wikipedia.invalid/{lang}"

    # Intentionally short so timeout and retry tests stay fast.
    connect-timeout: 200ms
    read-timeout: 500ms

  resilience:
    retry-wait: 10ms
    bulkhead-max-wait: 50ms

  # Off in tests: a pass would share the circuit breaker, bulkhead and cool-down with the
  # tests' own requests and break their request counts. TimelineIndexer is tested directly.
  timeline:
    cron: "-"

  # A small fixed set of editorial content, so tests do not break when the real texts change.
  # EditorialContentTest checks the real ones.
  editorial:
    root: classpath:editorial-test

logging:
  level:
    root: WARN