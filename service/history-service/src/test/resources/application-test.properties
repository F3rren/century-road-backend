# Test-only values, never used outside this profile.
# .invalid is reserved (RFC 2606): even if a test forgot to stub Wikipedia, nothing resolves
# and nothing is ever sent to the real one.
history.wikipedia.contact=https://example.invalid/century-road-tests
history.wikipedia.host-template=http://wikipedia.invalid/{lang}

# Short on purpose, so the tests that exercise timeouts and retries stay fast.
history.wikipedia.connect-timeout=200ms
history.wikipedia.read-timeout=500ms
history.resilience.retry-wait=10ms
history.resilience.bulkhead-max-wait=50ms

logging.level.root=WARN
