# What Caddy does in front of the gateway on the VPS (infra/caddy/Caddyfile), for a deployment
# where nothing of ours does: Railway terminates TLS itself, and the gateway is the first thing
# of ours that a request reaches.
#
# Add it to the profiles that are already active, with SPRING_PROFILES_INCLUDE=railway. It cannot
# be SPRING_PROFILES_ACTIVE: the images start with -Dspring.profiles.active=prod, and a system
# property outranks that variable. Without it nothing here applies, so the VPS is unchanged.
#
# Not done here: the caller's address. It depends on how the platform's edge sets
# X-Forwarded-For, which has to be observed on a real deployment before anything is trusted.

# Only health on the public port. The gateway serves its actuator on the same port as the API,
# so metrics and info would be readable by anyone. Railway's healthcheck needs /actuator/health,
# and there is no Prometheus in that setup to scrape the rest.
management.endpoints.web.exposure.include=health

# The security headers the proxy adds, on every proxied response. Same values as the Caddyfile,
# and the same HSTS_MAX_AGE, which starts low on purpose: a browser that has seen the header
# refuses plain HTTP for the whole window, so a broken certificate in the first rollout would
# lock people out for as long as it says. Raise it once HTTPS has been stable for a while.
#
# The filter's own default is 631138519 seconds, about twenty years, hence the explicit value.
# It also adds a Content-Security-Policy and three legacy headers the proxy never set, which
# mean nothing on a JSON API, so they are disabled to keep the two deployments alike.
#
# One difference from the proxy: this is a filter on the routes, so only proxied responses
# carry the headers. The gateway's own answers (the actuator, a path with no route) do not,
# where Caddy set them on everything. A browser takes HSTS from any HTTPS response of the
# host, and the API's are the ones it sees.
spring.cloud.gateway.default-filters[0]=SecureHeaders
spring.cloud.gateway.filter.secure-headers.strict-transport-security=max-age=${HSTS_MAX_AGE:300}; includeSubDomains
spring.cloud.gateway.filter.secure-headers.disable=x-xss-protection,content-security-policy,x-download-options,x-permitted-cross-domain-policies
