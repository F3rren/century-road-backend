spring:
  application:
    name: gateway

  # Use the production profile when none is explicitly active.
  profiles:
    default: prod

  cloud:
    gateway:
      # The gateway handles preflight OPTIONS requests for the frontend.
      # Authentication uses a bearer token, not a browser-attached cookie.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - X-Request-Id
            exposedHeaders:
              - X-Request-Id
              - Retry-After
            maxAge: 3600

# One Swagger UI at the gateway for both downstream services.
# API documentation remains disabled unless explicitly enabled.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    urls:
      - name: auth-service
        url: /docs/auth-service/v3/api-docs
      - name: history-service
        url: /docs/history-service/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO