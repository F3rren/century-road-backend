spring:
  application:
    name: gateway

  # Use the production profile when none is explicitly active.
  profiles:
    default: prod

  cloud:
    gateway:
      server:
        webflux:
          # Reactor Netty waits forever by default: an upstream that accepts the connection and then
          # stalls would hold the browser's request, and a gateway connection, open until something
          # else gave up. These are the bounds; the answer when one is hit is a 504 (response) or a
          # connection error (connect) instead of a hang.
          #
          # 10s covers auth-service (BCrypt login is the slowest call, well under a second). The
          # history route overrides it below, in the route definitions: it can legitimately take
          # far longer, because one request may load the requested language and then the fallback
          # one from Wikipedia, each with its own retry.
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s

          # The two routes, written once for every profile. Requests are forwarded without stripping
          # their /api/... paths. The addresses come from century-road.* below.
          routes:
            - id: auth-service
              uri: ${century-road.auth-service-uri}
              predicates:
                - "Path=/api/auth/**,/api/admin/users/**,/api/me/**"
            - id: history-service
              uri: ${century-road.history-service-uri}
              predicates:
                - "Path=/api/history/**"
              metadata:
                # Milliseconds, and the longest history-service itself can take: primary and fallback
                # language loaded one after the other, each up to ~14s (connect 2s + read 5s, two
                # attempts, 300ms apart, plus the bulkhead's 1s wait). A flat 10s would turn answers
                # it was about to give into 504s. Keep it above that figure if those timeouts grow.
                response-timeout: 30000
          # The gateway handles preflight OPTIONS requests for the frontend.
          # Authentication uses a bearer token, not a browser-attached cookie.
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${century-road.frontend-origin}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - X-Request-Id
                exposedHeaders:
                  - X-Request-Id
                  - Retry-After
                maxAge: 3600

# Where the two services and the frontend are: supplied by the deployment, with no default here so a
# production start never falls back to a development address. application-dev.yml gives the local ones.
century-road:
  auth-service-uri: ${AUTH_SERVICE_URI}
  history-service-uri: ${HISTORY_SERVICE_URI}
  frontend-origin: ${FRONTEND_ORIGIN}

# One Swagger UI at the gateway for both downstream services.
# API documentation remains disabled unless explicitly enabled.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    urls:
      - name: auth-service
        url: /docs/auth-service/v3/api-docs
      - name: history-service
        url: /docs/history-service/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO