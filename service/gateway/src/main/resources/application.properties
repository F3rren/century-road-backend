spring.application.name=gateway

server.port=${GATEWAY_PORT:8080}

# Routes. auth-service already exposes its real /api/... paths, so the gateway
# forwards requests unmodified, no path-stripping filter needed.
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URI:http://auth-service:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/admin/users/**,/api/me/**

# history-service, same: it serves its real /api/history/... paths. Public, like the routes of
# auth-service that hand out tokens - there is nothing per-user in it.
spring.cloud.gateway.routes[1].id=history-service
spring.cloud.gateway.routes[1].uri=${HISTORY_SERVICE_URI:http://history-service:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/history/**

# CORS. The frontend lives in its own repository and is therefore a different origin,
# so without this the browser refuses every call before it ever reaches a route.
# Handled here rather than in auth-service because the gateway answers the preflight
# itself: the OPTIONS request never has to travel any further.
#
# Origins are listed explicitly, never "*": the wildcard would let any site on the
# internet script calls against this API using a token it tricked a user into leaking.
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=${FRONTEND_ORIGIN:http://localhost:5173}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=Authorization,Content-Type,X-Request-Id
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposedHeaders=X-Request-Id,Retry-After
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600
# allowCredentials stays off: this API authenticates with a bearer token in a header,
# not with a cookie the browser would attach on its own.

# API documentation: one Swagger UI here for every service. Each service publishes its own
# OpenAPI document; OpenApiDocsRoutes relays them at /docs/<service>/v3/api-docs, because in
# production the services are not reachable from a browser. Off unless switched on: this is the
# one public address, and describing an API is something to enable on purpose. The dev profile
# turns it on; anywhere else, SPRINGDOC_API_DOCS_ENABLED=true and SPRINGDOC_SWAGGER_UI_ENABLED=true
# do (and the same on each service, or there is nothing to relay).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.swagger-ui.urls[0].name=auth-service
springdoc.swagger-ui.urls[0].url=/docs/auth-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=history-service
springdoc.swagger-ui.urls[1].url=/docs/history-service/v3/api-docs

# Actuator - same pair every other service exposes, so this one shows up on the same
# Prometheus/Grafana dashboards without a special case.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.prometheus.metrics.export.enabled=true

logging.level.root=INFO
logging.level.centuryroad=DEBUG

# Locked down by default, same reasoning as auth-service: forgetting
# SPRING_PROFILES_ACTIVE should land on the hardened profile, not a permissive default.
spring.profiles.default=prod
