server:
  # Local default; override it with GATEWAY_PORT if needed.
  port: ${GATEWAY_PORT:8080}

  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param

spring:
  devtools:
    restart:
      enabled: true

# Local defaults: the services started on the host, Vite's port for the frontend.
century-road:
  auth-service-uri: ${AUTH_SERVICE_URI:http://localhost:8081}
  history-service-uri: ${HISTORY_SERVICE_URI:http://localhost:8082}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    centuryroad: DEBUG
    org.springframework.cloud.gateway: DEBUG