server:
  # Local default; override it with GATEWAY_PORT if needed.
  port: ${GATEWAY_PORT:8080}

  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param

spring:
  devtools:
    restart:
      enabled: true

  cloud:
    gateway:
      # Downstream services can be started individually on the host machine.
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - "Path=/api/auth/**,/api/admin/users/**,/api/me/**"

        - id: history-service
          uri: ${HISTORY_SERVICE_URI:http://localhost:8082}
          predicates:
            - "Path=/api/history/**"
          metadata:
            # Milliseconds, and the longest history-service itself can take: primary and fallback
            # language loaded one after the other, each up to ~14s (connect 2s + read 5s, two
            # attempts, 300ms apart, plus the bulkhead's 1s wait). A flat 10s would turn answers
            # it was about to give into 504s. Keep it above that figure if those timeouts grow.
            response-timeout: 30000

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${FRONTEND_ORIGIN:http://localhost:5173}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    centuryroad: DEBUG
    org.springframework.cloud.gateway: DEBUG