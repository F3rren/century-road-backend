# No internal detail in the error responses: a default can change between Spring Boot
# versions, so this file says what is wanted, not what happens to be the case today.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Behind the TLS-terminating proxy (infra/caddy/Caddyfile): trust the X-Forwarded-*
# headers it sets, so the app sees the real scheme and the real caller instead of the
# proxy's own. This is what lets Spring Security emit HSTS - it writes that header only
# on a request it considers secure - and what keeps the login rate limiter keyed on the
# caller rather than on a single constant address.
#
# Safe ONLY because that proxy overwrites X-Forwarded-* rather than forwarding what the
# caller sent. The standard Forwarded header is not among the ones it overwrites, so it is
# dropped there and ignored here too (XForwardedOnlyHeaderTransformer): only X-Forwarded-*
# is trusted. Never enable this on a service reachable directly from the internet: a caller
# could then claim any address it likes and walk around the rate limiting.
server.forward-headers-strategy=framework

# CVE-2025-41235: since Spring Cloud Gateway 2025.0, it no longer adds X-Forwarded-*/Forwarded
# to the proxied request at all unless told which proxies to trust - the fix for a gateway that
# blindly forwarded whatever a caller sent. ".*" is correct here (not a specific address) because
# trust isn't enforced by matching a peer IP: it comes from the gateway never being reachable
# except through this one proxy (see the port comment on the gateway service in compose-prod.yml).
# Without this, auth-service sees no address at all and the login rate limiter cannot key on it.
spring.cloud.gateway.trusted-proxies=.*
