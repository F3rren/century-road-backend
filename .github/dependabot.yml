version: 2

# Every entry targets develop on purpose: version updates land where the work happens
# and reach main through the usual release PR. Note that SECURITY updates ignore this
# and always open against the default branch - that is GitHub's behaviour, not a
# setting, and the only way to move them is to make develop the default branch.
#
# Minor and patch bumps are grouped into one PR per ecosystem. A major is deliberately
# left on its own: that is the one worth reading before merging.

updates:
  # ---------- Maven ----------
  - package-ecosystem: maven
    directory: "/service/auth-service"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      maven-minor-and-patch:
        update-types:
          - minor
          - patch
    # springdoc is built against one Spring Boot line: 2.6.0 is the last release on 3.3, 2.7 is on
    # 3.4. It moves together with Spring Boot, in a PR that says so, not as a grouped bump that
    # compiles and then fails at startup. Patch releases of the same line still come through.
    ignore:
      - dependency-name: "org.springdoc:*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: maven
    directory: "/service/gateway"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      maven-minor-and-patch:
        update-types:
          - minor
          - patch
    # springdoc is built against one Spring Boot line: 2.6.0 is the last release on 3.3, 2.7 is on
    # 3.4. It moves together with Spring Boot, in a PR that says so, not as a grouped bump that
    # compiles and then fails at startup. Patch releases of the same line still come through.
    ignore:
      - dependency-name: "org.springdoc:*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: maven
    directory: "/service/history-service"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      maven-minor-and-patch:
        update-types:
          - minor
          - patch
    # springdoc is built against one Spring Boot line: 2.6.0 is the last release on 3.3, 2.7 is on
    # 3.4. It moves together with Spring Boot, in a PR that says so, not as a grouped bump that
    # compiles and then fails at startup. Patch releases of the same line still come through.
    ignore:
      - dependency-name: "org.springdoc:*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  # ---------- Docker ----------
  # The service Dockerfiles (eclipse-temurin). The compose files are a separate ecosystem,
  # docker-compose, further down: "docker" only reads Dockerfiles, so an entry for the
  # repository root under it would never have found an image.
  #
  # A new Java major is never taken here. The JDK version has to move everywhere at
  # once - java.version in both pom.xml files, the Java in ci.yml, and every FROM in both
  # Dockerfiles - or what CI tests is not what ships. That is a decision, not a bump.
  - package-ecosystem: docker
    directory: "/service/auth-service"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
    groups:
      docker-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/service/gateway"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
    groups:
      docker-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/service/history-service"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
    groups:
      docker-minor-and-patch:
        update-types:
          - minor
          - patch

  # ---------- Docker Compose ----------
  # compose-dev.yml and compose-prod.yml: postgis, caddy, Prometheus and Grafana. Their versions
  # are written in the files (not in .env) precisely so they show up here. The two files pin
  # the same versions, and Dependabot proposes each bump for both.
  - package-ecosystem: docker-compose
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # A new PostGIS major is a database upgrade: it needs a dump and restore, not a new tag.
      - dependency-name: "postgis/postgis"
        update-types: ["version-update:semver-major"]
    groups:
      compose-minor-and-patch:
        update-types:
          - minor
          - patch

  # ---------- GitHub Actions ----------
  - package-ecosystem: github-actions
    directory: "/.github/workflows"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
