name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.service }} build, test and quality
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, gateway, history-service]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: cd service/${{ matrix.service }} && chmod +x mvnw

      - name: Build, test and quality checks
        run: cd service/${{ matrix.service }} && ./mvnw --batch-mode --errors --fail-at-end clean verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.service }}
          path: service/${{ matrix.service }}/target/site/jacoco
          if-no-files-found: ignore

      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports-${{ matrix.service }}
          path: |
            service/${{ matrix.service }}/target/surefire-reports
            service/${{ matrix.service }}/target/failsafe-reports
          if-no-files-found: ignore

  # Publishes the production images, built from compose-prod.yml so that what runs somewhere
  # else is the definition this repository already ships. It needs the whole build-and-test
  # matrix to be green, so an image is never published for a commit that failed a test, and it
  # runs on pushes only: a pull request has nothing to publish yet.
  #
  # Each image gets the short commit id (immutable, what to pin) and a moving tag: "latest" on
  # the default branch, the branch name on any other.
  publish-images:
    name: ${{ matrix.service }} image
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Declaring permissions at all drops every unlisted scope to none, so contents: read has to
    # be spelled out again or the checkout below loses read access. security-events: write is
    # for the Trivy SARIF upload further down, same as codeql.yml's job permissions.
    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # The services compose-prod.yml builds: keep in step with the list above.
        service: [auth-service, gateway, history-service]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR refuses upper case in a name and github.repository keeps whatever the account or
      # the repository was created with, so the prefix is lower-cased here rather than typed.
      - name: Work out image prefix and tags
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "prefix=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            echo "moving=latest" >> "$GITHUB_OUTPUT"
          else
            echo "moving=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      # compose-prod.yml will not load without the secrets its containers need at run time
      # (${VAR:?...}), and Bake loads the whole file even to build three of its services. None of
      # those values reaches an image, so the template's placeholders are enough. A new required
      # variable has to be added to .env.example anyway, so there is no second list to keep.
      - name: Provide placeholder values for Compose interpolation
        run: cp .env.example .env

      # source: . builds from the checkout. Without it Bake reads the definition from the
      # repository's Git URL instead, and compose-prod.yml would be looked up over the network.
      - name: Build and push
        uses: docker/bake-action@v7
        env:
          IMAGE_PREFIX: ${{ steps.names.outputs.prefix }}
          IMAGE_TAG: ${{ steps.names.outputs.sha }}
        with:
          source: .
          files: compose-prod.yml
          targets: ${{ matrix.service }}
          push: true
          # One cache per service: sharing a key would have the three legs overwrite each
          # other's layers instead of reusing them.
          set: |
            *.cache-from=type=gha,scope=${{ matrix.service }}
            *.cache-to=type=gha,scope=${{ matrix.service }},mode=max

      # Scans the image just pushed, by its immutable SHA tag, so what gets scanned is exactly
      # what was published. ignore-unfixed is a deliberate policy: a HIGH/CRITICAL CVE in the
      # base image with no fix available yet should not keep this job red forever. Dependabot's
      # existing github-actions group already tracks bumps to this action.
      - name: Scan the image for vulnerabilities
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.names.outputs.prefix }}-${{ matrix.service }}:${{ steps.names.outputs.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Uploaded whether the scan passed or failed, so findings are visible in the Security tab
      # even on a red run - the same tab codeql.yml already publishes to, one category per
      # service so the three legs of this matrix don't overwrite each other's results.
      - name: Upload scan results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      # Fails the job only after the SARIF above is already uploaded, so a vulnerable image
      # still blocks the moving tag below without hiding what was found.
      - name: Fail if the scan found HIGH/CRITICAL vulnerabilities
        if: steps.trivy.outcome == 'failure'
        run: exit 1

      # Retagging the pushed manifest copies no layers and rebuilds nothing: the moving tag and
      # the commit tag are the same image, byte for byte.
      - name: Point the moving tag at it
        env:
          IMAGE: ${{ steps.names.outputs.prefix }}-${{ matrix.service }}
          SHA_TAG: ${{ steps.names.outputs.sha }}
          MOVING_TAG: ${{ steps.names.outputs.moving }}
        run: docker buildx imagetools create --tag "$IMAGE:$MOVING_TAG" "$IMAGE:$SHA_TAG"

  # The release script decides what gets published under a version, so it is tested like code.
  # It talks to gh and docker through stand-ins: no network, a few seconds.
  release-script:
    name: release script test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Test the release script
        run: bash .github/scripts/release_test.sh

  # The Caddyfile is what puts HSTS and the other security headers on every response, and what
  # makes them replace the ones a service sends itself. That is only worth anything if it holds
  # on a real Caddy, so this runs one in Docker in front of a stand-in for the services.
  caddy-headers:
    name: Caddyfile headers test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Test the Caddyfile
        run: bash infra/caddy/headers_test.sh
